project:
  type: website
  output-dir: _site
  resources:
    - assets/**
    - google3061026915a95eac.html

website:
  title: "Christine Park"
  # Replace this before launch so RSS, the sitemap, and social cards use your URL.
  site-url: "https://sparkcpark.github.io"
  description: "The personal website of Christine Park: research, publications, and writing."
  favicon: assets/favicon.svg
  open-graph: true
  twitter-card: true
  search: false
  navbar:
    pinned: true
    left:
      - text: About
        href: index.qmd
      - text: Publications
        href: publications.qmd
      - text: Blog
        href: blog.qmd
  page-footer:
    left: "© 2026 Christine Park"

format:
  html:
    theme: flatly
    css: styles.css
    include-in-header: includes/umami.html
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    anchor-sections: true

execute:
  freeze: auto
